<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crisis Ops – Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16232d;--mut:#5d6b76;--line:#d5dce1;--bg:#eef1f3;--navy:#1c3a4d;--blue:#1f6fd1;--amber:#d98a1b;--red:#c23b2e;--green:#2f8f4e}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14px/1.4 'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 12px;flex-wrap:wrap}
.brand{font-weight:600;color:var(--navy);padding-right:8px}
.nav{display:flex;overflow-x:auto}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 10px;color:var(--mut)}
.nav button.on{color:var(--navy);border-color:var(--blue);font-weight:600}
.stat{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{border:0;border-radius:3px;padding:3px 8px;font-size:11px;font-weight:600;text-align:left;line-height:1.2}
.chip small{display:block;font-weight:400;opacity:.8}
.L0{background:#d4ecdb;color:#1b5e33}.L1{background:#f8e3a6;color:#6b4a00}.L2{background:#f6c58d;color:#7a3d00}.L3{background:#f2b4ac;color:#7d1c12}
.who{font-size:12px;color:var(--mut)}.who button{margin-left:6px}
.badge{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px}
.sub{background:var(--navy);color:#fff;padding:6px 12px;display:flex;gap:10px;align-items:center;font-size:12px}
.sub select{background:#fff;border-radius:3px;border:0;padding:3px}
#main{flex:1;min-height:0;overflow:auto}
.g3{display:grid;grid-template-columns:300px 1fr 290px;height:100%}
.pan{background:#fff;overflow:auto;padding:12px;border-right:1px solid var(--line)}
#map{position:relative;background:#cde4f2;min-height:440px}#map svg{display:block;width:100%;height:100%}.mi{position:absolute;left:10px;top:10px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px;max-width:240px;font-size:12px}.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
h2{font-size:16px;margin:0 0 8px}h3{font-size:13px;margin:14px 0 6px}
.tabs{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap}
.tabs button{border:0;background:#e6ebee;padding:5px 12px;border-radius:3px}.tabs button.on{background:var(--blue);color:#fff}
.card{border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px;cursor:pointer;background:#fff}
.card.sel{border:2px solid var(--blue);padding:7px}
.card b{display:block}.card .m{font-size:12px;color:var(--mut)}
.tag{display:inline-block;background:#26333c;color:#fff;border-radius:3px;padding:1px 7px;font-size:11px;margin:4px 4px 4px 0}
.tag.o{background:#b5651d}.tag.c{background:#6b7780}
.bar{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0}.bar i{display:block;height:9px;border-radius:2px}.bar span{width:150px;flex:none}
.big{font-size:28px;font-weight:600;line-height:1}
.pad{padding:14px;max-width:1200px;margin:auto}
.two{display:grid;grid-template-columns:300px 1fr;gap:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:#f4f6f7}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
input[type=text],select.f,textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:6px;background:#fff}
.btn{background:var(--blue);color:#fff;border:0;border-radius:3px;padding:7px 14px}.btn.s{background:#fff;color:var(--ink);border:1px solid #9aa7af}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.st{border:0;border-radius:3px;padding:2px 10px;font-weight:600}
.Pending{background:#f1d98b}.Assigned{background:#c9d4e6}.InProgress{background:#2f8f4e;color:#fff}.Done{background:#d4ecdb}
.tl{border-left:2px solid #333;margin-left:60px;padding-left:16px}.tl div{position:relative;margin-bottom:14px}
.tl div:before{content:'';position:absolute;left:-24px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #333}
.tl time{position:absolute;left:-92px;top:0;font-size:12px;color:var(--mut);width:56px;text-align:right}
.msg{margin:6px 0;padding:6px 10px;background:#e6eef7;border-radius:6px;max-width:80%}.msg.me{background:#d9efe0;margin-left:auto}.msg small{color:var(--mut)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#16232d;color:#fff;padding:8px 16px;border-radius:4px;display:none}
#modal{position:fixed;inset:0;background:rgba(22,35,45,.55);display:none;overflow:auto;padding:20px;z-index:5}#modal .sheet{background:#fff;max-width:760px;margin:auto;padding:24px;border-radius:4px}#modal ul{padding-left:18px}@media print{#app,.ban,#toast,.noprint{display:none!important}#modal{position:static;background:none;padding:0}}
.ban{background:#fff4d6;border-bottom:1px solid #e8d38d;text-align:center;font-size:12px;padding:3px}
@media(max-width:860px){.g3{grid-template-columns:1fr;height:auto}#map{height:320px}.two{grid-template-columns:1fr}.stat{margin-left:0}}
</style></head><body>
<div class="ban">Prototype for demonstration. All data is fictional and stored only in your browser.</div>
<div id="app"></div><div id="toast" role="status"></div><div id="modal" role="dialog" aria-label="Incident report"></div>
<script>
const KEY='crisisops-demo-v4',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=m=>new Date(Date.now()-m*60000).toISOString();
const fmt=i=>new Date(i).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const hm=i=>new Date(i).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const SEV={P1:'#c23b2e',P2:'#d98a1b',P3:'#1f6fd1'},PRI=['P0','P1','P2','P3','P4'],PC=['#222','#c23b2e','#d98a1b','#2f8f4e','#bbb'];
const DOM=['Emergency Housing','Structural Safety','Essential Services','Trees','Animals & Pets','Finance','Logistics','Manpower & Resources','Security','Public Communications'];
const NAV=[['dash','Dashboard'],['ws','Workspace'],['inc','Incidents'],['new','New incident'],['life','Lifecycle'],['rep','Reports'],['log','Ops Logs'],['aid','Staff Aids'],['task','Tasks & Requests'],['col','Collaborate'],['cfg','Settings']];
const ALL=DOM.slice(),H=['Emergency Housing','Essential Services','Logistics','Manpower & Resources'];
const ROLES={'MND HQ':{d:ALL},'HDB HQ':{d:[...H,'Finance','Public Communications']},'ZCC':{d:[...H,'Security','Public Communications']},'BCA Ops':{d:['Structural Safety','Essential Services']},'NParks':{d:['Trees','Animals & Pets']},'Management':{d:ALL,v:['dash','inc','rep','life','cfg']},'Ground Officer':{d:['Structural Safety','Trees','Emergency Housing','Security'],v:['inc','task','log']}};
const OF={'EH Officer':['Emergency Housing'],'SS Officer':['Structural Safety'],'ES Officer':['Essential Services'],'Manpower Officer':['Manpower & Resources'],'Logistics Officer':['Logistics'],'Finance Officer':['Finance'],'Public Comms Officer':['Public Communications'],'Trees & Animals Officer':['Trees','Animals & Pets'],'Security Officer':['Security']};
Object.entries(OF).forEach(([k,d])=>ROLES[k]={d,o:1,v:['ws','inc','task','log','aid','col','life']});
const AG={'Emergency Housing':'HDB HQ','Structural Safety':'BCA Ops','Essential Services':'HDB HQ','Trees':'NParks','Animals & Pets':'NParks','Finance':'MND HQ','Logistics':'HDB HQ','Manpower & Resources':'MND HQ','Security':'ZCC','Public Communications':'MND HQ'};
const STG=['Detect','Assess','Activate','Plan','Task','Respond','Monitor','Recover','Close'],PD=['Confirm the detection','Approve severity assessment','Approve activation','Approve response plan','Approve tasking','Confirm response complete','Decide to stand down','Approve recovery plan','Approve closure'];
const WID=[['inc','Open incidents'],['ovr','Overdue tasks'],['man','Manpower readiness'],['stk','Low stock'],['fin','Finance utilisation'],['alr','Alerts'],['sit','Reports pending']],BL={sum:'Summary',cas:'Casualties',act:'Actions',tsk:'Tasks',tl:'Timeline',rep:'Reports on file'};
const R=()=>ROLES[S.role],vis=d=>R().d.includes(d),INC=()=>S.inc.filter(i=>vis(i.nat)||(R().o&&S.task.some(t=>t.inc===i.id&&(R().d.includes(t.fn)||R().d.includes(t.from))))),zoneOf=i=>i.ll[1]<103.78?'West':i.ll[1]<103.88?'Central':'East';
const sla=t=>S.cfg.sla[t.pri]||60,age=t=>Math.round((Date.now()-new Date(t.t))/60000),lvl=t=>['Pending','Assigned'].includes(t.st)?(age(t)>sla(t)?2:age(t)>sla(t)/2?1:0):0;
function sweep(){S.task.forEach(t=>{if(!t.t)t.t=ago(0);if(!t.esc&&S.cfg.esc&&lvl(t)===2){t.esc=1;addLog(t.inc,`Task ${t.id} overdue and escalated to ${AG[t.fn]} supervisor`,'System');S.bc.unshift({t:ago(0),txt:`Overdue: ${t.id} ${t.what}`,by:'Escalation to '+AG[t.fn]})}})}
const finU=()=>Math.round(S.dom['Finance'].filter(r=>r[3]!=='Requested').reduce((a,r)=>a+(+String(r[2]).replace(/,/g,'')||0),0)/S.fin.budget*100);
function kpi(k){const tk=S.task.filter(t=>vis(t.fn)),od=tk.filter(t=>lvl(t)===2).length,mp=S.dom['Manpower & Resources'],mr=mp.length?Math.round(mp.filter(r=>r[2]==='Present').length/mp.length*100):0,fu=finU(),lo=S.stock.filter(x=>x.q<x.min).length;
return{inc:[INC().filter(i=>i.st==='Open').length,'open incidents',0],ovr:[od,'overdue tasks',od>0],man:[mr+'%','manpower readiness',mr<S.cfg.man],stk:[lo,'items below minimum stock',lo>0],fin:[fu+'%','budget utilised',fu>=S.cfg.fin],alr:[S.bc.length,'alerts and broadcasts',0],sit:[S.rep.filter(r=>r.status==='Pending Review').length,'reports pending review',0]}[k]}
const mkTask=(fn,inc,what,who,pri)=>S.task.push({id:code(fn)+'-REQ-'+String(S.task.length+1).padStart(3,'0'),fn,inc,what,who:who||'Unassigned',pri:pri||'Medium',st:'Pending',t:ago(0)});
function mkInc(nat,title,loc,sev,tk,lead){const id='OPS/'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'/'+String(S.nxt++).padStart(4,'0');S.inc.unshift({id,nat,title,loc,ll:[1.30+Math.random()*.08,103.74+Math.random()*.16],sev,st:'Open',t:ago(0),cas:[0,0,0,0,0],stage:4});addLog(id,'Incident created by '+S.role,S.role);tk.forEach(w=>mkTask(nat,id,w,lead,sev==='P1'?'High':'Medium'));save();return id}
let wd=null,dd=[],nd='Structural Safety',nf={t:'',l:''};
const LV=['Green','Yellow','Orange','Red'];
function seed(){return{
inc:[
{id:'OPS/20261028/0001',nat:'Structural Safety',title:'Structural crack at residential block',loc:'Block 12 Northgate Ave',ll:[1.4,103.83],sev:'P1',st:'Open',t:ago(150),cas:[0,1,2,1,3]},
{id:'OPS/20261026/0001',nat:'Essential Services',title:'Burst water pipe at residential block',loc:'Block 48 Riverside View',ll:[1.29,103.8],sev:'P2',st:'Open',t:ago(2900),cas:[0,0,0,1,1]},
{id:'OPS/20261020/0001',nat:'Emergency Housing',title:'Temporary shelter for displaced residents',loc:'Harbour Road Community Hall',ll:[1.32,103.9],sev:'P2',st:'Open',t:ago(11000),cas:[1,0,1,0,1]},
{id:'OPS/20261019/0001',nat:'Trees',title:'Fallen tree blocking road',loc:'Ridge Expressway exit 6',ll:[1.38,103.75],sev:'P3',st:'Open',t:ago(12000),cas:[0,0,0,0,0]},
{id:'OPS/20261018/0001',nat:'Animals & Pets',title:'Pets left behind in evacuated block',loc:'Block 12 Northgate Ave',ll:[1.395,103.85],sev:'P3',st:'Open',t:ago(1200),cas:[0,0,0,0,0]},
{id:'OPS/20261018/0002',nat:'Security',title:'Crowd control at relief centre',loc:'Hillview Community Club',ll:[1.36,103.77],sev:'P2',st:'Open',t:ago(900),cas:[0,0,0,0,0]},
{id:'OPS/20261018/0003',nat:'Finance',title:'Emergency repair funding approval',loc:'Head office',ll:[1.29,103.85],sev:'P3',st:'Open',t:ago(800),cas:[0,0,0,0,0]},
{id:'OPS/20261018/0004',nat:'Public Communications',title:'Public advisory on affected blocks',loc:'Operations centre',ll:[1.33,103.86],sev:'P2',st:'Open',t:ago(600),cas:[0,0,0,0,0]},
{id:'OPS/20261018/0005',nat:'Logistics',title:'Water distribution to affected residents',loc:'Depot A',ll:[1.35,103.71],sev:'P3',st:'Open',t:ago(500),cas:[0,0,0,0,0]},
{id:'OPS/20261015/0001',nat:'Manpower & Resources',title:'Shortage of marshals at relief centre',loc:'Eastgate Relief Centre',ll:[1.43,103.77],sev:'P3',st:'Open',t:ago(18000),cas:[0,0,0,0,0]},
{id:'OPS/20261002/0001',nat:'Essential Services',title:'Lift outage at elderly housing block',loc:'Block 7 Orchard Close',ll:[1.34,103.85],sev:'P3',st:'Closed',t:ago(40000),cas:[0,0,0,0,0]}],
log:[
{t:ago(10),inc:'OPS/20261028/0001',msg:'Incident updated by Operator 01',by:'System'},
{t:ago(70),inc:'OPS/20261028/0001',msg:'Situation report submitted by Operator 01',by:'System'},
{t:ago(110),inc:'OPS/20261028/0001',msg:'Situation report saved as draft by Operator 01',by:'System'},
{t:ago(150),inc:'OPS/20261028/0001',msg:'Incident created by Operator 01',by:'System'},
{t:ago(2880),inc:'OPS/20261026/0001',msg:'Incident created by Operator 02',by:'System'}],
rep:[
{id:'R-1',inc:'OPS/20261028/0001',tpl:'Situation Report',title:'Structural crack at residential block',level:'Major',details:'Crack observed along level 4 corridor. Area cordoned off.',status:'Pending Review',t:ago(70)},
{id:'R-2',inc:'OPS/20261026/0001',tpl:'Generic Template',title:'Burst water pipe at residential block',level:'Moderate',details:'Water supply cut to 60 units.',status:'Approved',t:ago(2800)}],
task:[
{id:'HSE-REQ-001',fn:'Emergency Housing',inc:'OPS/20261028/0001',what:'Household HH-03 (5 persons, infant) to Harbour Hall',who:'Team East',pri:'High',st:'Assigned'},
{id:'HSE-REQ-002',fn:'Emergency Housing',inc:'OPS/20261028/0001',what:'Household HH-04 (3 persons, wheelchair access)',who:'Team East',pri:'High',st:'In Progress'},
{id:'HSE-REQ-003',fn:'Emergency Housing',inc:'OPS/20261028/0001',what:'Household HH-07 (2 persons, elderly)',who:'Unassigned',pri:'Medium',st:'Pending'},
{id:'LOG-REQ-001',fn:'Logistics',inc:'OPS/20261026/0001',what:'Deliver 200 bottled water cartons',who:'Depot A',pri:'High',st:'In Progress'},
{id:'MAN-REQ-001',fn:'Manpower & Resources',inc:'OPS/20261015/0001',what:'Deploy 6 marshals to relief centre',who:'Duty officer',pri:'Medium',st:'Pending'},
{id:'FIN-REQ-001',fn:'Finance',inc:'OPS/20261028/0001',what:'Approve emergency repair contract',who:'Finance lead',pri:'Medium',st:'Pending'}],
chat:{'OPS/20261028/0001':[{by:'Operator 01',txt:'Cordon in place at level 4. Waiting on structural engineer.',t:ago(60)},{by:'Engineer Lim',txt:'On site in 20 min. Please keep residents off the corridor.',t:ago(45)}]},
bc:[{t:ago(30),txt:'Heavy rain expected 3pm to 6pm. Check drainage-related incidents.',by:'Operations Director'}],
ind:[1,1,2,1],chk:{},nxt:7}}
let tf=0,S=load(),view='dash',sel=null,flt='Open',aidCat='Structural Safety',tab='Emergency Housing',map=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
sel=S.inc[0].id;
const gi=id=>S.inc.find(i=>i.id===id),addLog=(inc,msg,by='System')=>{S.log.unshift({t:ago(0),inc,msg,by});save()};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2200)}
const IND=['Threat level','Public health','Air quality','Weather'];
function head(){return`<div class="top"><span class="brand">Crisis Ops</span>
<nav class="nav" aria-label="Main">${NAV.filter(n=>!R().v||R().v.includes(n[0])).map(([k,n])=>`<button data-a="nav" data-k="${k}" class="${view===k?'on':''}">${n}</button>`).join('')}</nav>
<div class="stat">${IND.map((n,i)=>`<button class="chip L${S.ind[i]}" data-a="ind" data-i="${i}" title="Click to change level">${n}<small>${LV[S.ind[i]]}</small></button>`).join('')}</div>
<div class="who"><select id="role" aria-label="Role">${Object.keys(ROLES).map(r=>`<option ${r===S.role?'selected':''}>${r}</option>`).join('')}</select> <select id="scn" aria-label="Scenario">${['Peacetime','NE','CE'].map(r=>`<option ${r===S.scn?'selected':''}>${r}</option>`).join('')}</select> ${S.ho?`<button class="btn" data-a="ack">Acknowledge handover from ${S.ho.by}</button> `:''}<button class="btn s" data-a="handover">Handover</button> <button class="btn s" data-a="inject">Inject event</button> <button class="btn s" data-a="nav" data-k="col">Alerts <span class="badge">${S.bc.length}</span></button> <button class="btn s" data-a="reset">Reset demo</button></div></div>`}
function pick(){const o=INC().filter(i=>i.st==='Open');return`<div class="sub">Working on incident <select id="pick" aria-label="Select incident">${o.map(i=>`<option value="${i.id}" ${i.id===sel?'selected':''}>${i.id} – ${esc(i.title)}</option>`).join('')}<option value="PREP" ${sel==='PREP'?'selected':''}>General (non-incident / preparedness)</option></select></div>`}
function bars(rows,col){const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map((r,i)=>`<div class="bar"><span>${esc(r[0])}</span><i style="width:${r[1]/mx*100}px;background:${col[i%col.length]}"></i>${r[1]}</div>`).join('')}
function vInc(){
const list=INC().filter(i=>flt==='All'||i.st===flt),op=INC().filter(i=>i.st==='Open'),cur=gi(sel);
const cas=[0,0,0,0,0];op.forEach(i=>i.cas.forEach((c,k)=>cas[k]+=c));
const nat={};op.forEach(i=>nat[i.nat]=(nat[i.nat]||0)+1);
return`<div class="g3"><aside class="pan"><h2>Incident list</h2><div class="tabs">${['Open','Closed','All'].map(f=>`<button data-a="flt" data-f="${f}" class="${flt===f?'on':''}">${f}</button>`).join('')}</div>
<div class="m">Showing ${list.length} of ${S.inc.length}</div>
${list.map(i=>`<div class="card ${i.id===sel?'sel':''}" tabindex="0" data-a="selinc" data-id="${i.id}"><b>${i.id}</b><span class="tag">${i.nat}</span><span class="tag ${i.st==='Open'?'o':'c'}">${i.st}</span><div>${esc(i.title)}</div><div class="m">${esc(i.loc)}<br>${fmt(i.t)} · ${S.task.filter(t=>t.inc===i.id&&t.st!=='Done').length} active tasks</div></div>`).join('')}
<button class="btn" data-a="nav" data-k="new">+ New incident</button></aside>
<div id="map" role="img" aria-label="Map of Singapore with incident locations"></div>
<aside class="pan"><h2>Situational picture</h2><div class="big">${op.length}</div><div class="m">open incidents</div>
<h3>Casualties by priority (${cas.reduce((a,b)=>a+b,0)})</h3>${bars(PRI.map((p,i)=>[p,cas[i]]),PC)}
<h3>Incident natures</h3>${bars(Object.entries(nat),['#1f6fd1','#c23b2e','#6a4fb3','#d98a1b','#2f8f4e'])}
${cur?(()=>{const tk=S.task.filter(t=>t.inc===cur.id),dn=tk.filter(t=>t.st==='Done').length,ck=AID[cur.nat].chk,cd=ck.filter((_,i)=>S.chk[cur.id+':'+cur.nat+':'+i]).length;return`<h3>Selected incident</h3><div class="box"><b>${esc(cur.title)}</b><div class="m">${cur.nat} · ${esc(cur.loc)} · ${cur.sev} · ${cur.st}</div>
<div class="m">Stage: ${STG[cur.stage]} · Lead: ${AG[cur.nat]}</div><div class="m">Tasks: ${tk.length} (${dn} done) · Actions: ${cd} of ${ck.length} done</div>
<div class="row"><button class="btn" data-a="inctasks">View tasks</button><button class="btn s" data-a="incaid">Staff aids</button><select id="rt" aria-label="Report template">${Object.keys(S.tpls).map(k=>`<option>${k}</option>`).join('')}</select><button class="btn s" data-a="genrep">Generate report</button></div>
<div class="row"><button class="btn s" data-a="nav" data-k="log">Ops log</button><button class="btn s" data-a="toggle">${cur.st==='Open'?'Close incident':'Reopen incident'}</button></div></div>

lay:e=>{S.lay[e.dataset.k]=e.checked;save();mapInit()},

inject:()=>{const E=[['Trees','Fallen tree on access road'],['Essential Services','Power outage at shelter'],['Structural Safety','Debris falling from facade'],['Public Communications','Rumours circulating online'],['Security','Crowd surge at relief centre']],e=E[Math.floor(Math.random()*E.length)];sel=mkInc(e[0],e[1],'Exercise injection ('+S.scn+')','P2',AID[e[0]].chk.slice(0,2),AG[e[0]]);toast('Event injected: '+e[1]);render()},
handover:()=>{S.ho={by:S.role,t:ago(0)};addLog(sel,'Handover initiated by '+S.role+', awaiting acknowledgement',S.role);save();toast('Handover raised');render()},
ack:()=>{addLog(sel,'Handover from '+S.ho.by+' acknowledged by '+S.role,S.role);S.ho=null;save();toast('Handover acknowledged');render()},
closem:()=>{$('#modal').style.display='none'},
printrep:()=>window.print(),
copyrep:()=>{const t=$('#modal .sheet').innerText.replace(/Print or save as PDF[\s\S]*$/,'');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Report copied'),()=>toast('Copy is not available here. Use Print instead'))},
savegen:()=>{const c=gi(sel);S.rep.unshift({id:'R-'+(S.rep.length+1+Math.floor(Math.random()*90)),inc:c.id,tpl:'Auto-generated',title:c.title,level:'Auto',details:'Generated incident report',status:'Pending Review',t:ago(0)});addLog(c.id,'Incident report generated and saved','Operator – Admin');save();toast('Saved to Reports')},

cycle:e=>{const O=['Pending','Assigned','In Progress','Done'],t=S.task.find(x=>x.id===e.dataset.id);t.st=O[(O.indexOf(t.st)+1)%4];addLog(t.inc,`Task ${t.id} is now ${t.st}`,'Operator – Admin');save();render()},
addtask:()=>{const w=$('#t-what').value.trim();if(!w)return toast('Describe the task first');const fn0=tab==='All'?DOM.find(vis):tab;S.task.push({id:code(fn0)+'-REQ-'+String(S.task.length+1).padStart(3,'0'),fn:fn0,inc:sel,what:w,who:$('#t-who').value.trim()||'Unassigned',pri:$('#t-pri').value,st:'Pending'});addLog(sel,`Task added: ${w}`,'Operator – Admin');save();render()},
send:()=>{const v=$('#cm').value.trim();if(!v)return;(S.chat[sel]=S.chat[sel]||[]).push({by:'Operator – Admin',txt:v,t:ago(0)});save();render();$('#cm').focus()},
bcast:()=>{const v=$('#bc').value.trim();if(!v)return toast('Write a broadcast first');S.bc.unshift({t:ago(0),txt:v,by:'Operator – Admin'});save();toast('Broadcast sent to all teams');render()},
reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();ensureDom();sel=S.inc[0].id;view='inc';render();toast('Demo data reset')}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&a.dataset.a!=='chk'&&A[a.dataset.a])A[a.dataset.a](a)});
document.addEventListener('change',e=>{if(e.target.id==='pick'){sel=e.target.value;render()}else if(e.target.id==='role'){S.role=e.target.value;dd=[];const v=R().v;if(v&&!v.includes(view))view=v[0];if(sel!=='PREP'&&!INC().some(i=>i.id===sel)){const o=INC()[0];sel=o?o.id:'PREP'}save();render()}else if(e.target.id==='scn'){A.scn(e.target)}else if(e.target.id==='nd'){nf.t=$('#nt').value;nf.l=$('#nl2').value;nd=e.target.value;render()}else if(e.target.dataset.a==='chk')A.chk(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='cm')A.send();else if(e.target.dataset.a==='selinc'||e.target.dataset.a==='cat')A[e.target.dataset.a](e.target)}});
render();
</script></body></html>
